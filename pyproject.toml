[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flagdown"
version = "0.2.0"
description = "Markdown → CTFd for course and training CTFs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Flagdown contributors" }]
keywords = ["ctfd", "ctf", "markdown", "training", "cyber"]
dependencies = [
  "requests>=2.28.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "click>=8.0",
]

[project.optional-dependencies]
dev = ["build", "wheel"]

[project.scripts]
flagdown = "flagdown.cli:cli"

[project.urls]
Repository = "https://github.com/azotheblue/flagdown"

[tool.setuptools.packages.find]
include = ["flagdown*"]

[tool.setuptools.package-data]
flagdown = ["ui/*.html", "ui/*.js"]
