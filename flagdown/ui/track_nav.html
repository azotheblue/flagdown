<!--
  Flagdown extras — sticky category / track selector on /challenges

  Paste into: Admin → Config → Theme → Footer
  (after any theme <style> block, or alone)

  Only runs on the player challenges page. Builds jump links from
  category headings that start with a digit (e.g. 1intel-malware).
-->
<style>
#flagdown-track-nav {
  position: sticky;
  top: 0;
  z-index: 1020;
  background: var(--bs-body-bg, #121212);
  border-bottom: 2px solid var(--bs-primary, #0d6efd);
  padding: 0.5rem 0;
  margin-bottom: 1rem;
  overflow-x: auto;
  white-space: nowrap;
}

#flagdown-track-nav strong {
  letter-spacing: 0.08em;
  margin-right: 0.5rem;
}

#flagdown-track-nav a {
  display: inline-block;
  margin: 0.15rem 0.35rem;
  padding: 0.25rem 0.6rem;
  border-radius: 999px;
  font-size: 0.85rem;
  text-decoration: none;
  border: 1px solid var(--bs-primary, #0d6efd);
  color: inherit !important;
}

#flagdown-track-nav a:hover {
  opacity: 0.85;
  text-decoration: none;
}
</style>

<script>
(function () {
  if (!/\/challenges\/?$/.test(location.pathname)) return;

  function slug(s) {
    return "cat-" + s.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  }

  function build() {
    if (document.getElementById("flagdown-track-nav")) return;

    const headings = [...document.querySelectorAll("h2, h3")].filter(function (h) {
      var t = h.textContent.trim();
      return /^\d/.test(t) && !h.closest("#flagdown-track-nav");
    });
    if (!headings.length) return;

    var nav = document.createElement("div");
    nav.id = "flagdown-track-nav";
    nav.innerHTML = "<strong>Tracks:</strong>";

    headings.forEach(function (h) {
      var name = h.textContent.trim();
      var id = slug(name);
      h.id = id;
      var a = document.createElement("a");
      a.href = "#" + id;
      a.textContent = name.replace(/^\d+/, "").replace(/^[-_]/, "").trim() || name;
      nav.appendChild(a);
    });

    var main = document.querySelector("main .container") || document.querySelector("main");
    if (main) main.prepend(nav);
  }

  var obs = new MutationObserver(function () { build(); });
  obs.observe(document.body, { childList: true, subtree: true });
  setTimeout(build, 500);
  setTimeout(build, 2000);
})();
</script>
